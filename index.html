<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#faf4ea">
  <title>RICE RALLY</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <script defer src="game.js"></script>
  <script defer src="questions.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main id="stage" aria-label="RICE RALLY เกมปฐมพยาบาล RICE">
    <section id="setup-screen" class="screen" aria-label="ตั้งชื่อกลุ่ม">
      <form id="setup-form" class="placed setup-card" data-box="421,93,829,736">
        <header class="rally-banner">
          <div class="banner-copy">
            <h1>RICE RALLY</h1>
            <p>เกมปฐมพยาบาล <span>·</span> 25 ช่อง <span>·</span> 15 นาที</p>
          </div>
          <div class="start-scene" aria-hidden="true">
            <i class="stadium-track"></i><i class="start-flag"></i>
            <div class="start-doctor" data-team="A"></div>
            <div class="start-doctor" data-team="D"></div>
          </div>
        </header>
        <fieldset><legend>ตั้งชื่อกลุ่ม</legend><div id="team-fields"></div></fieldset>
        <button class="start" type="submit">เริ่มเกม <span aria-hidden="true">→</span></button>
      </form>
      <button id="resume-game" class="placed resume-button" data-box="499,839,674,49" hidden>เล่นต่อ</button>
    </section>
    <section id="board-screen" class="screen" aria-label="กระดานคำถาม 25 ช่อง" hidden>
      <img class="screen-art" src="assets/board-open.png" alt="" draggable="false">
      <header class="placed board-header" data-box="298,9,1076,112">
        <div class="board-toolbar">
          <h2>RICE RALLY</h2>
          <output class="clock" aria-label="เวลาเกมคงเหลือ" id="elapsed">15:00</output>
          <button id="view-result" type="button" hidden>ดูผลคะแนน</button>
          <button id="exit-game" aria-label="กลับหน้าตั้งชื่อกลุ่ม">ออก ↗</button>
        </div>
        <div id="scores" class="scores" role="group" aria-label="คะแนนทั้งห้ากลุ่ม"></div>
      </header>
      <div id="tiles" role="group" aria-label="เลือกช่องคำถาม"></div>
    </section>
    <section id="question-screen" class="screen" aria-label="คำถาม" hidden>
      <img class="screen-art" src="assets/question.png" alt="" draggable="false">
      <output id="question-time" class="placed question-time" data-box="1312,57,154,68" aria-label="เวลาเกมคงเหลือ"></output>
      <article id="question-content" class="placed" data-box="232,211,1206,372">
        <div class="question-copy">
          <p id="question-points"></p>
          <h2 id="question-text" tabindex="-1"></h2>
          <ol id="question-options" hidden></ol>
        </div>
        <img id="question-photo" hidden alt="">
      </article>
      <button id="reveal" class="placed reveal" data-box="208,710,1255,201">ดูเฉลย</button>
    </section>
    <dialog id="feedback-dialog" aria-labelledby="feedback-title">
      <p class="tag" id="feedback-points"></p>
      <h2 id="feedback-title">เฉลย</h2>
      <p class="answer" id="feedback-answer"></p>
      <a id="feedback-source" hidden target="_blank" rel="noopener noreferrer">อ่านเพิ่มเติมจาก NHS</a>
      <fieldset class="award"><legend>กลุ่มไหนได้คะแนนข้อนี้?</legend>
        <div class="award-teams" id="award-teams"></div>
      </fieldset>
      <button class="text-button" id="skip">ไม่มีทีมได้คะแนน · เปิดช่องนี้</button>
    </dialog>
    <dialog id="race-dialog" aria-labelledby="race-title">
      <header class="race-header">
        <div><p class="race-caption">สนามแข่งคุณหมอ</p><h2 id="race-title"></h2></div>
        <strong id="race-gain"></strong>
      </header>
      <div class="race-field">
        <div class="race-markers" aria-hidden="true"><span>จุดเริ่มต้น</span><span>เส้นชัย ⚑</span></div>
        <ol id="race-lanes" aria-label="ตำแหน่งและคะแนนของห้าทีม"></ol>
      </div>
      <button id="race-next" class="solid-button">กลับสู่กระดาน</button>
    </dialog>
    <template id="runner-art">
      <svg class="runner" viewBox="0 0 78 76" aria-hidden="true" focusable="false">
        <g fill="none" stroke="#64452f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="39" cy="70" rx="22" ry="3" fill="#9b8060" opacity=".18" stroke="none"/>
          <g class="doctor-body">
            <g class="stride far-leg"><path d="M37 48l6 10-10 7" stroke-width="7" stroke="#757e72"/><path d="M33 63l-4 3q-2 3 2 4l8-4z" fill="#876b50"/></g>
            <g class="stride near-leg"><path d="M36 48l-4 10 11 7" stroke-width="7" stroke="#52675c"/><path d="M40 63l3 7h9q3-2-2-4l-4-1z" fill="#fff5df"/></g>
            <g class="ceremony-pose">
              <path d="M30 51l-2 16h5l4-15m0 0 1 15h5l-1-16" fill="#647667"/>
              <path d="M28 65h5l4 3q1 2-2 2h-9zm10 0h5l5 3q1 2-2 2h-9z" fill="#fff6e4"/>
            </g>
            <path d="M37 31q-8 0-12 12l-9 9q8 7 27 4l1-16z" fill="#fffaf0"/>
            <path d="M36 32l3 10 6-7-3-5z" fill="var(--silk)"/>
            <path d="M31 33l-3 9 5 3 4-10m-14 14 6 2" stroke="#a58b71" stroke-width="1.5"/>
            <path d="M30 30q-8-3-6-13Q25 4 41 5q15 0 16 15l3 5-4 2q-1 10-13 9z" fill="var(--skin)"/>
            <path d="M24 25q-6-6-3-13 0-7 8-7 3-6 11-4 9-3 16 6l2 5q-7 4-13-2l-3 6-5-1-5 10-3-3z" fill="var(--hair)"/>
            <path d="M49 19h1" stroke-width="3.2"/><path d="M50 29q3 2 5-1"/>
            <ellipse cx="45" cy="26" rx="3" ry="1.6" fill="#e99f84" stroke="none"/>
            <g class="swing-arm">
              <path d="M50 47v-4q0-3 3-3h6q3 0 3 4v3" fill="#fff3d4"/>
              <rect x="45" y="46" width="23" height="17" rx="4" fill="var(--silk)"/>
              <path d="M56.5 50v9m-4.5-4.5h9" stroke="#fffaf0" stroke-width="3.4"/>
              <path d="M36 37l7 8 9-5q3-2 5 1 1 2-2 4l-12 7q-3 1-5-2l-7-8z" fill="#fffaf0"/>
              <path d="M51 41q4-4 6-1 3 3-3 6l-3 1-2-4z" fill="var(--skin)"/>
            </g>
            <g class="ceremony-pose">
              <path d="M49 32h-6q-2 11 9 12m14-12h6q1 10-9 12" fill="none" stroke="var(--cup-edge)" stroke-width="2.8"/>
              <path d="M56 43h4v8l5 2v2H51v-2l5-2z" fill="var(--cup)" stroke="var(--cup-edge)"/>
              <path d="M48 29h19l-2 10q-1 6-7 7-7-1-8-7z" fill="var(--cup)" stroke="var(--cup-edge)"/>
              <path d="M50 30h15m-13 3 1 5" stroke="#fff7dd" stroke-width="1.7"/>
              <path d="m58 32 1 2.6 2.8.2-2.2 1.7.7 2.6-2.3-1.5-2.3 1.5.7-2.6-2.1-1.7 2.8-.2z" fill="#fff9e7" stroke="none"/>
              <path d="m34 38 6 9 12-3 2 5-15 5q-2 0-4-3l-6-9z" fill="#fffaf0"/>
              <path d="m51 44 4-2q4-1 3 3l-4 4-3 1-2-4z" fill="var(--skin)"/>
            </g>
          </g>
        </g>
      </svg>
    </template>
    <dialog id="finish-dialog" aria-labelledby="finish-title">
      <p id="finish-reason" class="tag"></p>
      <h2 id="finish-title">สรุปคะแนน</h2>
      <div class="awards-stage" id="awards-stage" hidden>
        <div class="celebration" id="celebration" aria-hidden="true"></div>
        <div class="podium" id="podium" role="group" aria-label="โพเดียมทีมที่ได้รางวัล"></div>
      </div>
      <ol id="ranking"></ol>
      <button id="finish-view" class="solid-button">ดูกระดาน</button>
      <button id="finish-new" class="text-button">กลับไปเริ่มเกมใหม่</button>
    </dialog>
    <div id="status" class="sr-only" role="status"></div>
    <p id="storage-notice" class="storage-notice" hidden>เบราว์เซอร์นี้บันทึกเกมไม่ได้ เล่นต่อได้จนกว่าจะปิดหน้าเว็บ</p>
  </main>
  <noscript>โปรดเปิด JavaScript เพื่อเล่น RICE RALLY</noscript>
</body>
</html>
